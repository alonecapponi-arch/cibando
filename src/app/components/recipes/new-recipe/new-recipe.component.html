<div class="container">
<section class="vh-100" style="background-color: #eee;">
  <div class="container h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-lg-12 col-xl-11">
        <div class="card text-black" id="bordo">
          <div class="card-body p-md-5">
            <div class="row justify-content-center">
              <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Registrazione Nuova Ricetta</p>

                <form class="mx-1 mx-md-4" [formGroup]="form" (ngSubmit)="onSubmit()">

                  <div class="d-flex flex-row align-items-center mb-4">
                    <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                    <div data-mdb-input-init class="form-outline flex-fill mb-0">
                     <i class="pi pi-user"></i><input type="text" id="form3Example1c" class="form-control" formControlName="title"/>
                      <label class="form-label" for="form3Example1c">Nome Ricetta</label>
                      <p class="help is-danger"  *ngIf="!form.get('title').valid && form.get('title').touched">
                        Il campo è obbligatorio
                      </p>

                    </div>
                  </div>

                  <div class="d-flex flex-row align-items-center mb-4">
                    <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                    <div data-mdb-input-init class="form-outline flex-fill mb-0">
                     <i class="pi pi-user"></i><input type="text" id="form3Example1c" class="form-control" formControlName="description"/>
                      <label class="form-label" for="form3Example1c">Descrizione</label>
                      <p class="help is-danger"  *ngIf="!form.get('description').valid && form.get('description').touched">
                        Il campo è obbligatorio
                      </p>

                    </div>
                  </div>
                  <div class="d-flex flex-row align-items-center mb-4">
                    <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                    <div data-mdb-input-init class="form-outline flex-fill mb-0">
                     <i class="pi pi-user"></i><input type="text" id="form3Example1c" class="form-control" formControlName="image"/>
                      <label class="form-label" for="form3Example1c">immagine</label>
                      <p class="help is-danger"  *ngIf="!form.get('image').valid && form.get('image').touched">
                        Il campo è obbligatorio
                      </p>

                    </div>
                  </div>

                  <div class="d-flex flex-row align-items-center mb-4">
                    <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                    <div data-mdb-input-init class="form-outline flex-fill mb-0">
                     <i class="pi pi-user"></i><input type="number" id="form3Example1c" class="form-control" formControlName="difficulty"/>
                      <label class="form-label" for="form3Example1c">Difficoltà</label>
                      <p class="help is-danger"  *ngIf="!form.get('difficulty').valid && form.get('difficulty').touched">
                        Il campo è obbligatorio
                      </p>

                    </div>
                  </div>

                  <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                    <p *ngIf="form.valid"> Il form è correttamente compilato </p>
                     <button type="submit" class="btn btn-primary btn-lg" [disabled]="!form.valid">Registrati</button>
                    </div>

                </form>

              </div>
              <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">

                <img src="../../../../assets/images/cibo-reg1.webp"
                  alt="Sample image">

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

</div>
